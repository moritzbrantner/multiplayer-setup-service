<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrabble lobby</title>
    <link rel="stylesheet" href="./common.css" />
    <script type="module" src="./scrabble.js"></script>
  </head>
  <body>
    <main class="panel">
      <h1>Scrabble</h1>
      <p id="status" role="status">Create a lobby to invite players.</p>
      <button id="create" type="button">Create Scrabble lobby</button>
      <p><a id="invite" hidden>Invite link</a></p>
      <button id="board" type="button" hidden>Open Scrabble board</button>
      <button id="player" type="button" hidden>Open Scrabble player</button>
      <button id="refresh" type="button" hidden>Check for game</button>
      <p><a href="./">Back</a></p>
    </main>
  </body>
</html>
