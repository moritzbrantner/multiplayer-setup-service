name: Bootstrap convergence foundation

on:
  push:
    branches: [chore/repository-convergence-round-2]

permissions:
  contents: write

concurrency:
  group: bootstrap-convergence-foundation
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/repository-convergence-round-2
          fetch-depth: 0

      - name: Check out pinned coding-tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: 54b6ae146fc8795022283012ce1fd58686cd4b9a
          path: .bootstrap/coding-tooling

      - name: Check out pinned convention registry
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: bb437f815a3f126f1f58a81e968f3f5891adcb4d
          path: .bootstrap/coding-agent-conventions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Materialize repository conventions
        run: |
          bun .bootstrap/coding-tooling/src/cli.ts conventions init \
            dependencies environment git playwright rust rust-performance \
            --conventions-root .bootstrap/coding-agent-conventions \
            --json
          chmod +x scripts/codex-environment.sh
          rm -rf .bootstrap

      - name: Commit generated foundation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add conventions.json conventions.lock.json .conventions scripts/codex-environment.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install managed repository conventions"
          git push origin HEAD:chore/repository-convergence-round-2
