name: Hardening Workspace

on:
  push:
    branches: [hardening/bounded-signaling-and-recovery]
    paths: [.github/workflows/hardening-workspace.yml]

permissions:
  contents: write

concurrency:
  group: hardening-workspace
  cancel-in-progress: false

jobs:
  validate-edits:
    if: github.repository == 'moritzbrantner/multiplayer-setup-service' && github.ref == 'refs/heads/hardening/bounded-signaling-and-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Apply hash-checked reviewed source patch
        shell: python
        run: |
          import base64, hashlib, subprocess, zlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/hardening-patch.{part}.b64').read_text().strip() for part in range(1, 4))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f65f667fdf69385c8c9024dd2f2da7515ef660eaf9aed83aa5ba76738c84fa34'
          path = Path('/tmp/hardening-client.patch')
          path.write_bytes(patch)
          # Workflow changes were committed through the authorized connector.
          # This contents-only job must not create or edit workflows.
          apply = ['git', 'apply', '--exclude=.github/workflows/*']
          if subprocess.run([*apply, '--reverse', '--check', str(path)], capture_output=True).returncode != 0:
              subprocess.run([*apply, '--check', str(path)], check=True)
              subprocess.run([*apply, str(path)], check=True)
          config = Path('e2e/turnserver.conf')
          if 'pidfile=' not in config.read_text():
              with config.open('a') as stream:
                  stream.write('pidfile=/tmp/multiplayer-acceptance-turn.pid\n')
      - name: Validate browser modules and models
        run: |
          for file in web/*.js web/*.mjs web-tests/*.mjs e2e/*.mjs; do node --check "$file"; done
          node --test web-tests/*.test.mjs
          node --test web-tests/*.perf.mjs
      - name: Validate Rust with the repository toolchain
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --locked
          cargo test --release --test performance_guardrails --locked -- --nocapture
      - name: Lock and install exact browser acceptance dependencies
        working-directory: e2e
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Install isolated TURN fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
          sudo systemctl stop coturn || true
          turnserver --version
      - name: Run integrated real-browser acceptance without retries
        working-directory: e2e
        run: npm test
      - name: Export source workspace and validation evidence
        if: always()
        run: |
          mkdir -p /tmp/hardening-workspace
          git add -N e2e docs/final-hardening.md web/content-upload-budget.js web-tests/content-upload-budget.test.mjs || true
          git diff --binary > /tmp/hardening-workspace/repair.patch
          tar --exclude=.git --exclude=target --exclude=node_modules --exclude=test-results --exclude=results -czf /tmp/hardening-workspace/worktree.tar.gz .
          if test -d e2e/results; then cp -R e2e/results /tmp/hardening-workspace/; fi
          if test -d e2e/test-results; then cp -R e2e/test-results /tmp/hardening-workspace/; fi
      - name: Upload workspace evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hardening-workspace
          path: /tmp/hardening-workspace
          retention-days: 3
      - name: Commit validated source to this work branch only
        if: success()
        run: |
          git diff --check
          git diff --quiet -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore README.md deploy docs/final-hardening.md e2e src tests web web-tests
          if ! git diff --cached --quiet; then
            git commit -m 'feat: harden content recovery and prove integrated browser networking'
            git push origin HEAD:refs/heads/hardening/bounded-signaling-and-recovery
          fi
