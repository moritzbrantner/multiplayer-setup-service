name: Rust Convention Diagnostics

on:
  push:
    branches: [chore/repository-convergence-round-2]

permissions:
  contents: read

concurrency:
  group: rust-convention-diagnostics
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
      - name: Show RUST-002 diagnostics
        run: cargo clippy --all-features --message-format=short -- -D clippy::unwrap_used -D clippy::expect_used
