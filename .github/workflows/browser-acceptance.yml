name: Browser Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Real browser direct, TURN, and recovery acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
      - name: Build real signaling service
        run: cargo build --release --locked --bin multiplayer-setup-service
      - name: Install locked browser harness and Chromium
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Install loopback-only TURN fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y coturn
          sudo systemctl stop coturn || true
          turnserver --version
      - name: Exercise production modules in isolated browser contexts
        working-directory: e2e
        run: npm test
      - name: Preserve browser failure and acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-acceptance-${{ github.sha }}
          path: |
            e2e/results
            e2e/test-results
          retention-days: 7
          if-no-files-found: error
