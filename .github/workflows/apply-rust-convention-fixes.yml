name: Apply Rust convention fixes

on:
  push:
    branches: [chore/repository-convergence-round-2]

permissions:
  contents: write

concurrency:
  group: apply-rust-convention-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/repository-convergence-round-2
          fetch-depth: 0

      - name: Replace panic-prone production control flow
        run: python3 scripts/apply-rust-convention-fixes.py

      - name: Format and verify convention
        run: |
          cargo fmt --all
          cargo clippy --all-features -- -D clippy::unwrap_used -D clippy::expect_used

      - name: Commit Rust convention fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove panic-prone Rust control flow"
          git push origin HEAD:chore/repository-convergence-round-2
