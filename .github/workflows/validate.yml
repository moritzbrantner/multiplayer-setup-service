name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Show toolchains
        run: |
          rustc --version --verbose
          cargo --version
          node --version
      - name: Check browser modules
        run: |
          for file in web/*.js web/*.mjs web-tests/*.mjs; do
            node --check "$file"
          done
      - name: Test browser networking models
        run: node --test web-tests/*.test.mjs
      - name: Test browser performance guardrails
        run: node --test web-tests/*.perf.mjs
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Test release performance guardrails
        run: cargo test --release --test performance_guardrails --locked -- --nocapture
