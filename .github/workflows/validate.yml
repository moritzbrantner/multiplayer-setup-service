name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Show Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Apply canonical Rust formatting and compile fix
        run: |
          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main.rs")
          source = path.read_text()
          source, count = re.subn(
              r"protocols\s*\.iter\(\)\s*\.any\(\|protocol\| protocol == WEBSOCKET_PROTOCOL\)",
              "protocols.contains(&WEBSOCKET_PROTOCOL)",
              source,
          )
          if count != 1:
              raise SystemExit(f"expected one WebSocket protocol comparison, found {count}")
          path.write_text(source)
          PY
          cargo fmt --all
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Build release binary
        run: cargo build --release
      - name: Persist canonical sources and lockfile
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Canonicalize Rust service and lock dependencies"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
