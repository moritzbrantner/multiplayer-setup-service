name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
      - name: Set up exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Show toolchains
        run: |
          rustc --version --verbose
          cargo --version
          node --version
          bun --version
      - name: Install locked TypeScript toolchain
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck browser sources
        run: bun run typecheck

      - name: Reject committed JavaScript sources
        run: python3 scripts/check-no-javascript-sources.py
      - name: Test browser networking models
        run: bun run --cwd web test
      - name: Test browser performance guardrails
        run: bun run --cwd web test:perf
      - name: Build browser TypeScript
        run: bun run --cwd web build
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Test release performance guardrails
        run: cargo test --release --test performance_guardrails --locked -- --nocapture
