name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Show toolchains
        run: |
          rustc --version --verbose
          cargo --version
          bun --version
      - name: Reject tracked JavaScript sources
        run: |
          if git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' | grep -q .; then
            echo "Tracked JavaScript source is not allowed; use TypeScript."
            git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx'
            exit 1
          fi
      - name: Build and test browser TypeScript
        run: (cd web && bun run check)
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Test release performance guardrails
        run: cargo test --release --test performance_guardrails --locked -- --nocapture

  browser-validation:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    uses: ./.github/workflows/browser-acceptance.yml
    secrets: inherit
    permissions:
      contents: read

  convergence-validation:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    uses: ./.github/workflows/convergence.yml
    secrets: inherit
    permissions:
      contents: read

  pages-validation:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  profile-validation:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    uses: ./.github/workflows/runtime-profile.yml
    secrets: inherit
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["validate", "browser-validation", "convergence-validation", "pages-validation", "profile-validation"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["validate", "browser-validation", "convergence-validation", "pages-validation", "profile-validation"]'
          allow-skipped: ${{ (github.event_name != 'pull_request' || github.base_ref != 'main') && '["browser-validation", "convergence-validation", "pages-validation", "profile-validation"]' || '[]' }}
