name: Runtime Profile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare store-scale runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check out runtime-profiler
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/runtime-profiler
          ref: 8280c95feb2a1075efa0480a9622e40c723e0b3a
          path: .runtime-profiler-tool

      - name: Build isolated runtime-profiler
        working-directory: .runtime-profiler-tool
        run: cargo build --release --locked

      - name: Move profiler outside measured worktree
        run: |
          cp .runtime-profiler-tool/target/release/runtime-profiler "$RUNNER_TEMP/runtime-profiler"
          rm -rf .runtime-profiler-tool
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prepare exact base with identical candidate workload
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-profile"
          git worktree add "$RUNNER_TEMP/multiplayer-base" "$BASE_SHA"
          test -z "$(git -C "$RUNNER_TEMP/multiplayer-base" status --porcelain --untracked-files=all)"

          # The code under measurement remains exact base vs exact candidate. The committed
          # candidate harness and scenario are copied into the base worktree so both sides
          # execute byte-identical workload definitions even when the harness itself is hardened.
          git show "$HEAD_SHA:src/bin/profile-stores.rs" > "$RUNNER_TEMP/multiplayer-base/src/bin/profile-stores.rs"
          git show "$HEAD_SHA:profiles/runtime-profiler/store-scale.yaml" > "$RUNNER_TEMP/multiplayer-base/profiles/runtime-profiler/store-scale.yaml"

          cmp src/bin/profile-stores.rs "$RUNNER_TEMP/multiplayer-base/src/bin/profile-stores.rs"
          cmp profiles/runtime-profiler/store-scale.yaml "$RUNNER_TEMP/multiplayer-base/profiles/runtime-profiler/store-scale.yaml"
          sha256sum src/bin/profile-stores.rs profiles/runtime-profiler/store-scale.yaml \
            | tee "$RUNNER_TEMP/runtime-profile/workload-sha256.txt"

      - name: Build identical committed profile workloads
        run: |
          cargo build --release --locked --bin profile-stores
          (
            cd "$RUNNER_TEMP/multiplayer-base"
            cargo build --release --locked --bin profile-stores
          )

      - name: Capture and score exact base against exact head
        env:
          PROFILER: ${{ runner.temp }}/runtime-profiler
          REFERENCE_SCENARIO: ${{ runner.temp }}/multiplayer-base/profiles/runtime-profiler/store-scale.yaml
          CANDIDATE_SCENARIO: ${{ github.workspace }}/profiles/runtime-profiler/store-scale.yaml
        run: |
          (
            cd "$RUNNER_TEMP/multiplayer-base"
            "$PROFILER" capture \
              --scenario "$REFERENCE_SCENARIO" \
              --output "$RUNNER_TEMP/runtime-profile/reference"
          )
          "$PROFILER" capture \
            --scenario "$CANDIDATE_SCENARIO" \
            --output "$RUNNER_TEMP/runtime-profile/candidate"
          "$PROFILER" validate --bundle "$RUNNER_TEMP/runtime-profile/reference"
          "$PROFILER" validate --bundle "$RUNNER_TEMP/runtime-profile/candidate"
          "$PROFILER" score \
            --reference "$RUNNER_TEMP/runtime-profile/reference" \
            --candidate "$RUNNER_TEMP/runtime-profile/candidate" \
            --json | tee "$RUNNER_TEMP/runtime-profile/score.json"
          "$PROFILER" summarize \
            --bundle "$RUNNER_TEMP/runtime-profile/reference" \
            > "$RUNNER_TEMP/runtime-profile/reference-summary.txt"
          "$PROFILER" summarize \
            --bundle "$RUNNER_TEMP/runtime-profile/candidate" \
            > "$RUNNER_TEMP/runtime-profile/candidate-summary.txt"
          {
            echo '## runtime-profiler store-scale comparison'
            echo
            echo 'Candidate-committed workload hashes used for both base and candidate:'
            echo '```text'
            cat "$RUNNER_TEMP/runtime-profile/workload-sha256.txt"
            echo '```'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/runtime-profile/score.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-profile-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/runtime-profile
          if-no-files-found: error
          retention-days: 14
