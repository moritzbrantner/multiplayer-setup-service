name: Repository Convergence

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: multiplayer-setup-service-convergence-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"

      - name: Set up exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Prepare exact repository environment
        run: bash scripts/codex-environment.sh maintenance

      - name: Conformance
        uses: moritzbrantner/coding-tooling@54b6ae146fc8795022283012ce1fd58686cd4b9a
        with:
          operation: conformance
          bun-version: 1.4.0
          report-path: .artifacts/coding-tooling/conformance.json

      - name: Foundation audit
        if: ${{ always() }}
        uses: moritzbrantner/coding-tooling@54b6ae146fc8795022283012ce1fd58686cd4b9a
        with:
          operation: foundation
          bun-version: 1.4.0
          report-path: .artifacts/coding-tooling/foundation.json

      - name: Deterministic findings
        if: ${{ always() }}
        uses: moritzbrantner/coding-tooling@54b6ae146fc8795022283012ce1fd58686cd4b9a
        with:
          operation: findings
          bun-version: 1.4.0
          report-path: .artifacts/coding-tooling/findings.json

      - name: Upload convergence evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repository-convergence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/coding-tooling
          if-no-files-found: error
          retention-days: 14
