name: Generate Bun lockfile

on:
  push:
    branches: [chore/repository-convergence-round-2]

permissions:
  contents: write

concurrency:
  group: generate-bun-lock
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/repository-convergence-round-2
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Generate workspace lockfile
        run: |
          rm -f e2e/package-lock.json
          bun install --lockfile-only --ignore-scripts

      - name: Commit canonical package-manager state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock e2e/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Adopt Bun workspace lockfile"
          git push origin HEAD:chore/repository-convergence-round-2
