schema_version = 1

[policy]
track = "latest-stable"

[system]
apt = []

[setup]
commands = ["cargo fetch --locked", "npm --prefix e2e ci --ignore-scripts"]

[maintenance]
commands = ["cargo fetch --locked", "npm --prefix e2e ci --ignore-scripts"]

[cache]
paths = ["~/.cargo", "~/.npm"]

[compatibility_holds]
