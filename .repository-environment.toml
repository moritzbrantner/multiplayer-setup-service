schema_version = 1

[policy]
track = "latest-stable"

[system]
apt = []

[setup]
commands = ["cargo fetch --locked", "bun install --frozen-lockfile --ignore-scripts"]

[maintenance]
commands = ["cargo fetch --locked", "bun install --frozen-lockfile --ignore-scripts"]

[cache]
paths = ["~/.cargo", "~/.bun/install/cache"]

[compatibility_holds]
